<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impostor Game - made by Igor</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script defer src="js/client.js"></script>
  </head>
  <body>
    <h1>Impostor Game - made by Igor</h1>

    <div class="container">
      <div class="content-area">
        <div id="controls">
          <input type="text" id="username" placeholder="Enter your name" />
          <input type="text" id="roomName" placeholder="Enter room code" />
          <button id="createBtn">Utwórz pokój</button>
          <button id="joinBtn">Dołącz do pokoju</button>
          <span id="userCount" style="display: none">Gracze: 0</span>
          <button id="copyBtn" style="display: none">Skopiuj kod</button>
          <button id="leaveBtn" style="display: none">Opuszcz pokój</button>
          <button id="startGameBtn" style="display: none">
            Rozpocznij grę
          </button>
        </div>
        <button id="nextRoundBtn" style="display: none">Następna runda</button>
        <div id="status"></div>
        <input type="checkbox" id="btnControl" />
        <div id="status"></div>
        <input type="checkbox" id="btnControl" style="display: none" />

        <label class="flip-card" for="btnControl">
          <div class="flip-card-inner">
            <div class="flip-card-front" id="gameStatus"></div>
            <div class="flip-card-back">Kliknij, aby odsłonić swoją rolę!</div>
          </div>
        </label>
        <div id="messages"></div>
      </div>

      <div class="player-list">
        <h3>Gracze w pokoju</h3>
        <ul id="playerList"></ul>
      </div>
    </div>
  </body>
</html>
